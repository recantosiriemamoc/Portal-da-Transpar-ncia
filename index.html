<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#003912">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Siriema">
<title>Recanto da Siriema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@600;700;800&display=swap">
<style>
/* Paleta tirada da logo: verde-mata do fundo, sálvia da siriema, oliva do letreiro.
   Layout: celular com barra de navegação embaixo; computador com barra lateral verde. */
:root {
  --mata: #003912;
  --mata-2: #0a4a20;
  --mata-3: #12582b;
  --salvia: #b5baa6;
  --salvia-clara: #e4e7da;
  --oliva: #9caf74;
  --oliva-texto: #4f6224;
  --papel: #f2f3ec;
  --cartao: #ffffff;
  --tinta: #132019;
  --suave: #47554c;
  --linha: #d3d8c8;
  --linha-forte: #8f9a88;
  --acao: #003912;
  --acao-texto: #ffffff;
  --ok: #17663a; --ok-fundo: #dfeedd;
  --atr: #8a5000; --atr-fundo: #fbeccb;
  --inad: #a3241f; --inad-fundo: #f9dfdb;
  --foco: #1a5fd0;
  --sombra: 0 1px 2px rgba(0, 40, 14, .06), 0 8px 24px rgba(0, 40, 14, .07);
  --raio: 20px;
  --raio-p: 14px;
  --f-titulo: "Playfair Display", Georgia, "Times New Roman", serif;
  --f-texto: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --nav-h: 78px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-bottom: calc(var(--nav-h) + 24px); scroll-padding-top: 90px; }
[hidden] { display: none !important; }
@media (min-width: 1024px) { html { scroll-padding: 24px; } }
html, body { margin: 0; }
body {
  background: var(--papel); color: var(--tinta);
  font-family: var(--f-texto); font-size: 19px; line-height: 1.55;
  min-height: 100vh;
}
@media (min-width: 1024px) { body { font-size: 20px; } }
h1, h2, h3 { font-family: var(--f-titulo); font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -.005em; }
h1 { font-size: 2.05rem; }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.2rem; }
p { margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 4px solid var(--foco); outline-offset: 3px; border-radius: 6px; }
svg.i { width: 1.25em; height: 1.25em; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Estrutura ---------- */
.ave { background-image: var(--ave); background-repeat: no-repeat; background-size: contain; background-position: center; }
.topo {
  position: sticky; top: 0; z-index: 20; background: var(--mata); color: #fff;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 12px;
}
.topo .ave { width: 40px; height: 52px; }
.topo .nome { font-family: var(--f-titulo); font-weight: 800; font-size: 1.3rem; line-height: 1.1; color: #fff; }
.topo .sub { font-size: .82rem; color: var(--salvia); letter-spacing: .04em; }
.topo .acoes { margin-left: auto; display: flex; gap: 8px; }
.topo .acoes button { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); color: #fff; border-radius: 12px; min-height: 44px; padding: 6px 12px; font-weight: 700; font-size: .9rem; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }

.lateral { display: none; }
main.conteudo {
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  max-width: 1180px; margin: 0 auto;
}
.navbaixo {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--cartao); border-top: 1px solid var(--linha);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px;
  box-shadow: 0 -6px 20px rgba(0, 40, 14, .08);
}
.navbaixo button {
  background: none; border: 0; border-radius: 14px; min-height: 62px; padding: 6px 2px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--suave); font-weight: 700; font-size: .8rem; line-height: 1.1;
}
.navbaixo button svg.i { width: 26px; height: 26px; }
.navbaixo button[aria-current="page"] { color: var(--mata); background: var(--salvia-clara); }
.navbaixo button.destaque span.bola {
  width: 54px; height: 54px; border-radius: 50%; background: var(--mata); color: #fff; display: grid; place-items: center;
  margin-top: -26px; box-shadow: 0 6px 16px rgba(0, 57, 18, .35); border: 4px solid var(--cartao);
}
.navbaixo button.destaque span.bola svg.i { width: 28px; height: 28px; stroke-width: 2.4; }

@media (min-width: 1024px) {
  .topo, .navbaixo { display: none; }
  .app { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100vh; }
  .lateral {
    display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    background: var(--mata); color: #fff; padding: 28px 20px 24px;
  }
  .lateral .marca { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 6px 0 22px; border-bottom: 1px solid rgba(255,255,255,.12); margin-bottom: 14px; }
  .lateral .marca .ave { width: 120px; height: 156px; }
  .lateral .marca .nome { font-family: var(--f-titulo); font-weight: 800; font-size: 1.6rem; line-height: 1.05; color: var(--oliva); }
  .lateral .marca .sub { font-size: .85rem; color: var(--salvia); letter-spacing: .06em; text-transform: uppercase; }
  .lateral button.item {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: none; border: 0; color: #e8ecdf;
    padding: 13px 14px; border-radius: 14px; font-weight: 700; font-size: 1.02rem; cursor: pointer; min-height: 54px;
  }
  .lateral button.item:hover { background: rgba(255,255,255,.07); }
  .lateral button.item[aria-current="page"] { background: var(--oliva); color: var(--mata); }
  .lateral .rodape { margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.12); display: grid; gap: 6px; }
  .lateral .quem { font-size: .9rem; color: var(--salvia); padding: 0 14px 6px; }
  main.conteudo { padding: 36px 44px 60px; }
}

/* ---------- Blocos ---------- */
.pilha { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
.pilha > * { min-width: 0; }
.grade { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .grade.d2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grade.d3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1024px) { .grade.lado { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); align-items: start; } }
.cartao { background: var(--cartao); border: 1px solid var(--linha); border-radius: var(--raio); padding: 22px; box-shadow: var(--sombra); min-width: 0; }
.cartao.plano { box-shadow: none; }
.cartao > h2 + p, .cartao > h3 + p { margin-top: 6px; }
.cab-secao { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 16px; }
.cab-secao p { color: var(--suave); }
.rotulo { font-size: .82rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--oliva-texto); }
.suave { color: var(--suave); }
.peq { font-size: .9rem; }
.sep { border: 0; border-top: 1px solid var(--linha); margin: 4px 0; }

.titulo-pag { display: grid; gap: 6px; margin-bottom: 4px; }
.titulo-pag p { color: var(--suave); max-width: 60ch; }

/* Destaque do saldo */
.heroi {
  position: relative; overflow: hidden; border-radius: 26px; padding: 26px 24px 24px; color: #fff;
  background: radial-gradient(120% 140% at 100% 0%, var(--mata-3) 0%, var(--mata) 55%);
  box-shadow: 0 14px 34px rgba(0, 57, 18, .25);
}
.heroi .ave.marca-dagua { position: absolute; right: -18px; bottom: -14px; width: 190px; height: 250px; opacity: .17; pointer-events: none; }
.heroi .rotulo { color: var(--oliva); }
.heroi .saldo { font-family: var(--f-titulo); font-weight: 800; font-size: clamp(2.4rem, 9vw, 3.6rem); line-height: 1.05; margin: 6px 0 4px; font-variant-numeric: lining-nums tabular-nums; }
.heroi .quando { color: var(--salvia); font-size: .95rem; }
.heroi .mini { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; position: relative; }
.heroi .mini > div { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 12px 14px; }
.heroi .mini .v { font-weight: 700; font-size: clamp(1.05rem, 4.4vw, 1.35rem); font-variant-numeric: tabular-nums; white-space: nowrap; }
.heroi .mini .l { font-size: .9rem; color: #dfe4d3; display: flex; align-items: center; gap: 6px; }

/* Navegação de mês */
.mesnav { display: inline-flex; align-items: center; gap: 6px; background: var(--cartao); border: 1px solid var(--linha); border-radius: 999px; padding: 5px; }
.mesnav button { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--salvia-clara); color: var(--tinta); display: grid; place-items: center; cursor: pointer; }
.mesnav button:disabled { opacity: .35; cursor: default; }
.mesnav strong { min-width: 9.5em; text-align: center; font-size: 1.05rem; }
.heroi .mesnav { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); }
.heroi .mesnav button { background: rgba(255,255,255,.14); color: #fff; }

/* Botões */
.btn {
  appearance: none; border: 2px solid transparent; border-radius: 16px; min-height: 56px; padding: 12px 22px; cursor: pointer;
  font-weight: 700; font-size: 1.05rem; display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-align: center;
  background: var(--acao); color: var(--acao-texto); text-decoration: none; line-height: 1.2;
  transition: transform .12s ease, filter .12s ease;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(.98); }
.btn.sec { background: var(--cartao); color: var(--tinta); border-color: var(--linha-forte); }
.btn.claro { background: var(--salvia-clara); color: var(--tinta); }
.btn.perigo { background: var(--cartao); color: var(--inad); border-color: var(--inad); }
.btn.perigo.cheio { background: var(--inad); color: #fff; }
.btn.zap { background: #1f7a4a; color: #fff; }
.btn.largo { width: 100%; min-height: 64px; font-size: 1.15rem; border-radius: 18px; }
.btn.peq { min-height: 46px; padding: 8px 14px; font-size: .95rem; border-radius: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }

/* Selos de situação: ícone + palavra, nunca só cor */
.selo { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 12px 5px 9px; font-weight: 700; font-size: .92rem; white-space: nowrap; line-height: 1.2; }
.selo svg.i { width: 1.05em; height: 1.05em; stroke-width: 2.6; }
.selo.ok { background: var(--ok-fundo); color: var(--ok); }
.selo.atr { background: var(--atr-fundo); color: var(--atr); }
.selo.inad { background: var(--inad-fundo); color: var(--inad); }
.selo.neutro { background: var(--salvia-clara); color: var(--tinta); }

/* Contadores de situação */
.contas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.conta { border-radius: 18px; padding: 14px; border: 2px solid; display: grid; gap: 2px; }
.conta .n { font-family: var(--f-titulo); font-size: 2.1rem; font-weight: 800; line-height: 1; font-variant-numeric: lining-nums; }
.conta .t { font-weight: 700; font-size: .95rem; display: flex; align-items: center; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.conta.ok { background: var(--ok-fundo); border-color: transparent; color: var(--ok); }
.conta.atr { background: var(--atr-fundo); border-color: transparent; color: var(--atr); }
.conta.inad { background: var(--inad-fundo); border-color: transparent; color: var(--inad); }
.contas.linhas { grid-template-columns: minmax(0, 1fr); gap: 8px; } .contas.linhas .conta { grid-template-columns: 64px minmax(0, 1fr); align-items: center; padding: 10px 16px; } .contas.linhas .conta .n { font-size: 1.9rem; } .contas.linhas .conta .t { font-size: 1.05rem; }
@media (max-width: 560px) { .contas { grid-template-columns: minmax(0, 1fr); gap: 8px; } .conta { grid-template-columns: 64px minmax(0, 1fr); align-items: center; padding: 10px 16px; } .conta .n { font-size: 1.9rem; } .conta .t { font-size: 1.05rem; } }

/* Chácaras */
.chacaras { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 12px; }
.chacara { background: var(--cartao); border: 1px solid var(--linha); border-radius: 18px; padding: 14px 14px 12px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.chacara .n { font-family: var(--f-titulo); font-weight: 800; font-size: 1.9rem; line-height: 1; font-variant-numeric: lining-nums; overflow-wrap: anywhere; }
.chacara .n small { display: block; font-family: var(--f-texto); font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); margin-bottom: 4px; }
.chacara.inad { border-color: var(--inad); }
.chacara.atr { border-color: var(--atr); }
button.chacara { text-align: left; cursor: pointer; font: inherit; color: inherit; }
button.chacara:hover { border-color: var(--linha-forte); }

/* Campanhas */
.campanha { display: grid; gap: 12px; }
.campanha .top { display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: space-between; align-items: start; }
.barra { height: 18px; border-radius: 999px; background: var(--salvia-clara); overflow: hidden; }
.barra > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--mata-3), var(--oliva)); }
.numeros { display: grid; background: var(--papel); border-radius: 16px; padding: 4px 16px; }
.numeros > div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-top: 1px solid var(--linha); }
.numeros > div:first-child { border-top: 0; }
.numeros .l { color: var(--suave); }
.numeros .v { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 1.08rem; white-space: nowrap; }

/* Listas de movimentos */
.lista { list-style: none; padding: 0; margin: 0; display: grid; }
.lista > li { display: flex; gap: 14px; align-items: center; padding: 14px 2px; border-top: 1px solid var(--linha); min-width: 0; }
.lista > li:first-child { border-top: 0; }
.lista .ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; flex: 0 0 auto; }
.lista .ic.ent { background: var(--ok-fundo); color: var(--ok); }
.lista .ic.sai { background: var(--inad-fundo); color: var(--inad); }
.lista .ic.neu { background: var(--salvia-clara); color: var(--tinta); }
.lista .txt { flex: 1 1 auto; min-width: 0; }
.lista .txt strong { display: block; overflow-wrap: anywhere; }
.lista .txt span { color: var(--suave); font-size: .92rem; }
.lista .val { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.lista .val.ent { color: var(--ok); }
.lista .val.sai { color: var(--inad); }
.lista > li.cancelado { opacity: .6; }
.lista > li.cancelado .val { text-decoration: line-through; }
button.linha-btn { all: unset; display: flex; gap: 14px; align-items: center; width: 100%; cursor: pointer; border-radius: 12px; }
button.linha-btn:focus-visible { outline: 4px solid var(--foco); outline-offset: 3px; }

details.grupo { border-top: 1px solid var(--linha); }
details.grupo:first-of-type { border-top: 0; }
details.grupo > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 14px 2px; font-weight: 700; min-height: 56px; }
details.grupo > summary::-webkit-details-marker { display: none; }
details.grupo > summary .seta { transition: transform .15s ease; color: var(--suave); }
details.grupo[open] > summary .seta { transform: rotate(90deg); }
details.grupo > summary .nome { flex: 1 1 auto; min-width: 0; }
details.grupo > summary .val { margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; }
details.grupo .lista { padding: 0 0 8px 34px; }

.vazio { text-align: center; padding: 28px 12px; color: var(--suave); display: grid; gap: 8px; justify-items: center; }
.vazio .ave { width: 64px; height: 82px; opacity: .5; filter: grayscale(.2); }

/* Formulários */
form { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
form > * { min-width: 0; }
.app > *, .coluna { min-width: 0; }
.campo { display: grid; gap: 7px; min-width: 0; }
.campo > label, .campo > .lbl, fieldset > legend { font-weight: 700; font-size: 1.05rem; }
.campo .dica { font-size: .92rem; color: var(--suave); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: 10px; }
input[type=text], input[type=password], input[type=date], input[type=tel], input[type=number], input[type=month], input:not([type]), select, textarea {
  width: 100%; min-height: 58px; padding: 13px 16px; border-radius: 14px; border: 2px solid var(--linha-forte);
  background: var(--cartao); font-size: 1.12rem;
}
textarea { min-height: 130px; resize: vertical; line-height: 1.5; }
select { appearance: none; padding-right: 48px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 26px) 50%, calc(100% - 19px) 50%; background-size: 7px 7px; background-repeat: no-repeat; }
input:focus, select:focus, textarea:focus { border-color: var(--mata); outline: 4px solid var(--foco); outline-offset: 1px; }
.dupla { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) { .dupla { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.valor-campo { position: relative; }
.valor-campo span { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-weight: 700; color: var(--suave); pointer-events: none; }
.valor-campo input { padding-left: 52px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Escolhas (cartões de opção) */
.opcoes { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.opcao { position: relative; }
.opcao input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.opcao > span {
  display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 12px 14px; border-radius: 16px; border: 2px solid var(--linha-forte);
  background: var(--cartao); font-weight: 700; line-height: 1.2;
}
.opcao > span small { display: block; font-weight: 400; color: var(--suave); font-size: .85rem; margin-top: 2px; }
.opcao > span > .marca { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--linha-forte); flex: 0 0 auto; display: grid; place-items: center; }
.opcao input[type=checkbox] + span > .marca { border-radius: 8px; }
.opcao input:checked + span { border-color: var(--mata); background: var(--salvia-clara); }
.opcao input:checked + span > .marca { background: var(--mata); border-color: var(--mata); color: #fff; }
.opcao input:checked + span > .marca::after { content: ""; width: 10px; height: 6px; border-left: 3px solid currentColor; border-bottom: 3px solid currentColor; transform: rotate(-45deg) translate(1px, -1px); }
.opcao input:focus-visible + span { outline: 4px solid var(--foco); outline-offset: 2px; }
.opcao input:disabled + span { opacity: .45; text-decoration: line-through; }

/* Abas segmentadas */
.segmento { display: flex; gap: 6px; padding: 6px; background: var(--salvia-clara); border-radius: 18px; flex-wrap: wrap; }
.segmento button { flex: 1 1 0; min-width: 0; text-align: center; line-height: 1.2; min-height: 52px; border: 0; border-radius: 13px; background: none; font-weight: 700; cursor: pointer; color: var(--suave); padding: 8px 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
@media (max-width: 480px) { .segmento button svg.i { display: none; } .segmento button { padding: 8px 6px; font-size: .95rem; } }
.segmento button[aria-selected="true"] { background: var(--cartao); color: var(--tinta); box-shadow: 0 2px 8px rgba(0, 40, 14, .12); }

  function ocupadosDoDia(iso) { return S.cal.filter(function (r) { return r.dia === iso; }); }
  function estadoDia(iso) {
    var o = ocupadosDoDia(iso);
    if (!o.length) return 'livre';
    var ps = S.info.periodos.filter(function (p) { return p !== 'Dia inteiro'; });
    if (o.some(function (r) { return r.periodo === 'Dia inteiro'; }) || ps.every(function (p) { return o.some(function (r) { return r.periodo === p; }); })) return 'lotado';
    return 'parcial';
  }
  function desenhaCal() {
    var p = S.mesCal.split('-'), y = Number(p[0]), m = Number(p[1]) - 1;
    var primeiro = new Date(y, m, 1).getDay(), dias = new Date(y, m + 1, 0).getDate();
    var h = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'].map(function (d) { return '<span class="sem" aria-hidden="true">' + d + '</span>'; }).join('');
    for (var i = 0; i < primeiro; i++) h += '<span></span>';
    var hj = hoje();
    var nomesE = { livre: 'livre', parcial: 'parte do dia reservada', lotado: 'dia todo reservado' };
    for (var d = 1; d <= dias; d++) {
      var iso = y + '-' + pad(m + 1) + '-' + pad(d), est = estadoDia(iso), passado = iso < hj;
      var n = ocupadosDoDia(iso).length;
      h += '<button type="button" class="dia ' + est + (passado ? ' passado' : '') + (iso === hj ? ' hoje' : '') + '" data-acao="dia" data-dia="' + iso + '" aria-pressed="' + (S.diaSel === iso) + '"' + (passado ? ' disabled' : '') +
        ' aria-label="' + d + ' de ' + MESES[m] + ', ' + nomesE[est] + '"><span class="d" aria-hidden="true">' + d + '</span><span class="pts" aria-hidden="true">' + (est === 'livre' ? '' : new Array(Math.min(n, 3) + 1).join('<i></i>')) + '</span></button>';
    }
    $('#cal').innerHTML = h;
  }
  function desenhaPeriodos() {
    var info = $('#diaInfo');
    if (!S.diaSel) {
      info.innerHTML = '<p class="suave">Primeiro toque em um dia no calendário.</p>';
      $('#periodos').innerHTML = S.info.periodos.map(function (p) { return '<label class="opcao"><input type="radio" name="periodo" disabled><span><span class="marca"></span>' + esc(p) + '</span></label>'; }).join('');
      return;
    }
    var o = ocupadosDoDia(S.diaSel);
    info.innerHTML = '<p><strong style="font-size:1.15rem">' + dataBR(S.diaSel) + '</strong> · ' + diaSemana(S.diaSel) + '</p>';
    $('#periodos').innerHTML = S.info.periodos.map(function (p) {
      var conf = o.filter(function (r) { return r.periodo === p || r.periodo === 'Dia inteiro' || p === 'Dia inteiro'; });
      var porAssoc = conf.some(function (r) { return r.tipo === 'Associado'; });
      var sub = !conf.length ? 'Livre' : porAssoc ? 'Já reservado por associado' : 'Reservado por não associado';
      return '<label class="opcao"><input type="radio" name="periodo" value="' + esc(p) + '"' + (S.periodoSel === p ? ' checked' : '') + '><span><span class="marca"></span><span>' + esc(p) + '<small>' + sub + '</small></span></span></label>';
    }).join('');

  function mascaraCel(e) {
    var d = soDig(e.target.value).slice(0, 11), s = d;
    if (d.length > 2) s = '(' + d.slice(0, 2) + ') ' + d.slice(2);
    if (d.length > 7) s = '(' + d.slice(0, 2) + ') ' + d.slice(2, d.length - 4) + '-' + d.slice(-4);
    e.target.value = s;
  }

  function enviarReserva(f) {
    var msg = $('#resMsg');
    var ch = $('#rCh').value;
    if (!S.diaSel) { msg.innerHTML = caixa('atr', 'Falta escolher o dia', 'Toque em um dia no calendário.'); return; }
    var per = ($('input[name=periodo]:checked') || {}).value;
    if (!per) { msg.innerHTML = caixa('atr', 'Falta escolher o período', 'Escolha manhã, tarde, noite ou o dia inteiro.'); return; }
    if (!ch) { msg.innerHTML = caixa('atr', 'Falta escolher a chácara', 'Se você não é associado, escolha "Não sou associado".'); $('#rCh').focus(); return; }
    if (navigator.onLine === false) { msg.innerHTML = caixa('atr', 'Sem internet', 'Para reservar é preciso estar conectado, porque o sistema confere se a data está livre. Tente de novo quando tiver internet.'); return; }
    var btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.innerHTML = 'Enviando…';
    chamar('reservar', { dia: S.diaSel, periodo: per, chacara: ch === '__nao' ? '' : ch, nome: $('#rNome').value, celular: $('#rCel').value }).then(function (r) {

      if (r.fila) { msg.innerHTML = caixa('atr', r.titulo, r.mensagem); return; }
      var extra = '<p><strong>' + dataBR(r.dia) + '</strong> · ' + esc(r.periodo) + '</p>';

      }
      msg.innerHTML = caixa(r.taxa ? 'info' : 'ok', r.titulo, r.mensagem, extra);
      return sincronizar().then(function () { S.cal = LOCAL.calendario(S.mesCal); desenhaCal(); desenhaPeriodos(); });

      btn.disabled = false; btn.innerHTML = ic('cal') + 'Pedir reserva';
      msg.innerHTML = caixa('inad', 'Não foi possível reservar', e.message || String(e));

  }

  // Lê o arquivo escolhido; fotos são reduzidas para subir rápido.
  function lerArquivo(input) {
    var f = input && input.files && input.files[0];
    if (!f) return Promise.resolve(null);
    if (f.size > 8 * 1048576 && f.type.indexOf('image') !== 0) return Promise.reject(new Error('O PDF é grande demais. O limite é 8 MB.'));
    return new Promise(function (ok, erro) {
      var rd = new FileReader();
      rd.onerror = function () { erro(new Error('Não foi possível ler o arquivo.')); };
      rd.onload = function () {
        var url = rd.result;
        if (f.type.indexOf('image') !== 0) { ok({ nome: f.name, tipo: f.type || 'application' + '/' + 'pdf', base64: String(url).split(',')[1] }); return; }
        var img = new Image();
        img.onload = function () {
          var max = 1600, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
          var cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          var tipo = 'image' + '/' + 'jpeg';
          ok({ nome: f.name.replace(/\.[^.]+$/, '') + '.jpg', tipo: tipo, base64: cv.toDataURL(tipo, 0.72).split(',')[1] });
        };
        img.onerror = function () { ok({ nome: f.name, tipo: f.type, base64: String(url).split(',')[1] }); };
        img.src = url;
      };
      rd.readAsDataURL(f);
    });
  }

    dia: function (el) { S.diaSel = el.dataset.dia; desenhaCal(); desenhaPeriodos(); var p = $('#periodos'); if (p && window.innerWidth < 1024) p.scrollIntoView({ behavior: 'smooth', block: 'center' }); },
    mesMov: function (el) { S.mesMov = somaMes(S.mesMov, Number(el.dataset.n)); ir('movimentos'); },
    mesRel: function (el) { S.mesRel = somaMes(S.mesRel, Number(el.dataset.n)); desenhaRel(); },
    copiarTexto: function (el) { copiar(el.dataset.texto); },
    sair: function () { if (navigator.onLine !== false) chamar('sair', S.token).catch(function () { }); S.token = null; S.usuario = null; S.painel = null; guarda('siriema_token', null); DB.dir = null; gravarJSON('siriema_dir2', null); _cacheLanc.fonte = null; aviso('Você saiu.'); ir('inicio'); },
    verPublico: function () { ir('inicio'); },
    menuMais: function () {
      var itens = [['movimentos', 'Movimentos', 'lista'], ['associados', 'Associados', 'pessoas'], ['campanhas', 'Campanhas', 'bandeira']];
      if (S.usuario && S.usuario.perfil === 'admin') itens.push(['config', 'Configurações', 'engrenagem']);
      abrirModal('Mais opções', '<div class="pilha" style="gap:10px">' + itens.map(function (i) { return '<button class="btn sec largo" style="justify-content:flex-start" type="button" data-ir="' + i[0] + '">' + ic(i[2]) + i[1] + '</button>'; }).join('') +
        '<button class="btn sec largo" style="justify-content:flex-start" type="button" data-acao="verPublico">' + ic('olho') + 'Ver portal público</button>' +
        '<button class="btn perigo largo" style="justify-content:flex-start" type="button" data-acao="sair">' + ic('sair') + 'Sair</button></div>');
    },
    lancTipo: function (el) { S.lancTipo = el.dataset.tipo; $$('.segmento [data-acao=lancTipo]').forEach(function (b) { b.setAttribute('aria-selected', b === el); }); desenhaLanc(); },
    lancarPara: function (el) { var ch = el.dataset.ch; S.lancTipo = 'mensalidade'; fecharModal(); ir('lancar'); var t = setInterval(function () { var s = $('#mCh'); if (s) { clearInterval(t); s.value = ch; mostraMeses(); } }, 80); setTimeout(function () { clearInterval(t); }, 8000); },
    verMov: function (el) { verMov(Number(el.dataset.i)); },
    pedeCancMov: function (el) { pedeCancMov(el.dataset.id); },
    confCancMov: function (el) { confCancMov(el.dataset.id); },
    novoAssoc: function () { formAssoc(); },
    verAssoc: function (el) { verAssoc(el.dataset.ch); },
    editarAssoc: function (el) { formAssoc(assocPorCh(el.dataset.ch)); },
    novaCamp: function () { formCamp(); },
    editarCamp: function (el) { formCamp(S.painel.campanhas.filter(function (x) { return x.id === el.dataset.id; })[0]); },
    irReservas: function (el) { S.resAba = el.dataset.aba; ir('reservas'); },
    irRel: function (el) { S.relTipo = el.dataset.tipo; if (el.dataset.id) S.relCamp = el.dataset.id; ir('relatorios'); },
    resAba: function (el) { S.resAba = el.dataset.aba; $$('.segmento [data-acao=resAba]').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.aba === S.resAba); }); desenhaResAba(); },
    taxaPaga: function (el) { el.disabled = true; S.pubCache = {}; chamar('marcarTaxaPaga', S.token, el.dataset.id).then(function () { aviso('Taxa recebida. A entrada já foi lançada no caixa.'); recarregaRes(); }).catch(function (e) { el.disabled = false; falha(e); }); },
    pedeCancRes: function (el) { pedeCancRes(el.dataset.id); },
    confCancRes: function (el) {
      el.disabled = true;
      chamar('cancelarReserva', S.token, el.dataset.id, ($('#mot_' + el.dataset.id) || {}).value).then(function (r) {
        aviso(r.promovida ? 'Reserva cancelada. A vaga passou para o primeiro da fila.' : 'Reserva cancelada. O aviso está em "Avisos".'); recarregaRes();
      }).catch(function (e) { el.disabled = false; falha(e); });
    },
    avisoEnviado: function (el) { chamar('marcarAvisoEnviado', S.token, el.dataset.id).then(function () { aviso('Marcado como enviado.'); S.resAba = 'avisos'; recarregaRes(); }).catch(falha); },
    relTipo: function (el) { S.relTipo = el.dataset.tipo; $$('.segmento [data-acao=relTipo]').forEach(function (b) { b.setAttribute('aria-selected', b === el); }); desenhaRel(); },
    imprimir: function () { window.print(); },
    copiarRel: function () {
      var r = S.relAtual; if (!r) return;
      var t = '*Recanto da Siriema · Prestação de contas de ' + mesNome(r.mes) + '*\n\nSaldo anterior: ' + brl(r.saldoAnterior) + '\nEntradas: ' + brl(r.entradas) + '\n' +
        r.entradasPorCategoria.map(function (x) { return '  • ' + x.categoria + ': ' + brl(x.valor); }).join('\n') + '\nSaídas: ' + brl(r.saidas) + '\n' +
        r.saidasPorCategoria.map(function (x) { return '  • ' + x.categoria + ': ' + brl(x.valor); }).join('\n') + '\n*Saldo no fim do mês: ' + brl(r.saldoFinal) + '*';
      copiar(t);
    },
    novoUsuario: function () {
      abrirModal('Nova pessoa com acesso', '<form id="fUsu" novalidate>' +
        '<div class="campo"><label for="uNome">Nome</label><input id="uNome" type="text" placeholder="Ex.: Maria Silva"></div>' +
        '<div class="campo"><label for="uUsu">Usuário para entrar</label><input id="uUsu" type="text" autocapitalize="none" spellcheck="false" placeholder="Ex.: maria"><span class="dica">Sem acentos e sem espaços.</span></div>' +
        '<fieldset><legend>O que a pessoa pode fazer?</legend><div class="opcoes">' +
          '<label class="opcao"><input type="radio" name="uPer" value="operador" checked><span><span class="marca"></span><span>Lançamentos<small>Lança, consulta e cuida das reservas</small></span></span></label>' +
          '<label class="opcao"><input type="radio" name="uPer" value="admin"><span><span class="marca"></span><span>Administrador<small>Também muda configurações e acessos</small></span></span></label></div></fieldset>' +
        '<div id="uMsg" aria-live="polite"></div><button class="btn largo" type="submit">' + ic('ok') + 'Criar acesso</button></form>');
    },
    novaSenha: function (el) { chamar('novaSenhaUsuario', S.token, el.dataset.id).then(function (r) { mostraSenhaNova(r); }).catch(falha); },
    ativarUsuario: function (el) { if (precisaInternet()) return; chamar('ativarUsuario', S.token, el.dataset.id, el.dataset.ativo === '1').then(function () { aviso('Pronto.'); return sincronizar().then(function () { ir('config'); }); }).catch(falha); },
    trocarMinhaSenha: function () { abrirTrocaSenha(false); },
    addMes: function () { incluirMes(); },
    verCompPub: function (el) {
      abrirModal('Comprovante da despesa', carregando('Abrindo o comprovante…'));
      chamar('comprovantePublico', el.dataset.id).then(function (a) { mostraComprovante(a, 'Comprovante da despesa'); }).catch(function (e) { falha(e, $('#mCorpo')); });
    },
    verCompAdm: function (el) {
      abrirModal('Comprovante', carregando('Abrindo o comprovante…'));
      chamar('verComprovante', S.token, el.dataset.id).then(function (a) { mostraComprovante(a); }).catch(function (e) { falha(e, $('#mCorpo')); });
    },
    filtroAs: function (el) { S.filtroAs = el.dataset.f; desenhaAssoc(); },
    sincronizar: function () { if (navigator.onLine === false) { aviso('Sem internet. Conecte-se para sincronizar.', 'erro'); atualizaBarra(); return; } sincronizar(true).catch(falha); },
    gradeNav: function (el) {
      var n = Number(el.dataset.n), novo = somaMes(S.gradeFim || mesAtualL(), n);
      S.gradeFim = novo > mesAtualL() ? mesAtualL() : novo;
      if (S.vista === 'relatorios') desenhaRel(); else if (S.vista === 'associados') desenhaAssoc(); else desenhaChacaras();
    },
    editarCh: function (el) { var a = assocPorCh(el.dataset.ch); if (a) formAssoc(a); },
    addTerreno: function () { $('#terrenos').insertAdjacentHTML('beforeend', linhaTerreno()); var ls = $$('[data-terreno]'); $('[data-t=numero]', ls[ls.length - 1]).focus(); resumoTerrenos(); },
    remTerreno: function (el) { if ($$('[data-terreno]').length <= 1) { aviso('A pessoa precisa ter pelo menos um terreno.', 'erro'); return; } el.closest('[data-terreno]').remove(); resumoTerrenos(); },
    assocAba: function (el) { S.assocAba = el.dataset.aba; $$('.segmento [data-acao=assocAba]').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.aba === S.assocAba); }); desenhaAssoc(); },
    filaTentar: function (el) { fecharModal(); tentarFila(el.dataset.uid).then(function () { ir(S.vista); }).catch(falha); },
    filaDescartar: function (el) { descartarFila(el.dataset.uid); fecharModal(); aviso('Lançamento descartado.'); ir(S.vista); }
  };

  document.addEventListener('click', function (ev) {
    var irEl = ev.target.closest('[data-ir]');
    if (irEl) { ev.preventDefault(); ir(irEl.dataset.ir); return; }
    var a = ev.target.closest('[data-acao]');
    if (a && ACOES[a.dataset.acao]) {
      if (a.dataset.acao === 'fecharFundo' && ev.target !== a) return;
      ev.preventDefault(); ACOES[a.dataset.acao](a, ev);
    }
  });
  document.addEventListener('submit', function (ev) {
    var f = ev.target; ev.preventDefault();
    var mapa = { fRegR: function (form) { salvarRegularizacao(form, 'recomecar'); }, fRegA: function (form) { salvarRegularizacao(form, 'acordo'); }, fAnexo: function (form) {
        var btn = form.querySelector('button[type=submit]'); btn.disabled = true; btn.innerHTML = 'Enviando…';
        lerArquivo($('#aArq')).then(function (arq) {
          if (!arq) throw new Error('Escolha a foto ou o PDF do comprovante.');
          return chamar('anexarComprovante', S.token, form.dataset.id, arq);
        }).then(function () { aviso('Comprovante anexado.'); fecharModal(); return sincronizar().then(function () { ir('movimentos'); }); })
          .catch(function (e) { btn.disabled = false; btn.innerHTML = ic('mais') + 'Anexar comprovante'; aviso(e.message || String(e), 'erro'); });
      },
      fRes: enviarReserva, fLogin: entrar, fSenha: salvarSenha, fMens: salvarMens, fLanc: salvarLanc, fAssoc: salvarAssoc, fCamp: salvarCamp, fCfg: salvarCfg,
      fUsu: function () {
        chamar('criarUsuario', S.token, { nome: $('#uNome').value, usuario: $('#uUsu').value, perfil: ($('input[name=uPer]:checked') || {}).value })
          .then(function (r) { mostraSenhaNova(r); sincronizar(); }).catch(function (e) { $('#uMsg').innerHTML = caixa('inad', 'Não foi possível criar', e.message); });
      } };
    if (mapa[f.id]) mapa[f.id](f);
  });

  // ---------- Início ----------
  S.token = le('siriema_token');
  if (S.token) { DB.dir = lerJSON('siriema_dir2'); if (DB.dir) S.usuario = DB.dir.usuario; }
  var ultima = le('siriema_vista');
  atualizaBarra();
  if (S.token) ir(ultima && NAV_ADM.some(function (n) { return n[0] === ultima; }) ? ultima : 'painel');
  else ir(ultima && NAV_PUB.some(function (n) { return n[0] === ultima; }) && ultima !== 'entrar' ? ultima : 'inicio');
  // Já mostra o que está guardado e busca a versão nova em segundo plano.
  if (temDados() && (!S.token || DB.dir)) sincronizar().catch(function (e) { if (String(e && e.message).indexOf('SESSAO_') === 0) falha(e); });
  if (!DENTRO_DO_GOOGLE && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(function () { }); } catch (e) { } }
})();
</script>
</body>
</html>
